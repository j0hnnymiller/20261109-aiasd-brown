services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - task-manager-postgres:/var/lib/postgresql
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/001-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  task-manager-postgres:
