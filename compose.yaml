name: task-manager

services:
  postgres:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - task-manager-postgres:/var/lib/postgresql
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  task-manager-postgres:
