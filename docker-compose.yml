services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env and set local values}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and set local values}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local values}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - task-manager-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  task-manager-postgres:
