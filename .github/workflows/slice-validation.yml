name: Slice validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.detect.outputs.application }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect application and require complete verification setup
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git ls-files -- src tests web TaskManager.sln global.json)" ]]; then
            echo "application=false" >> "$GITHUB_OUTPUT"
            echo "Planning-only baseline: application checks are not applicable; no application tests were run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for path in TaskManager.sln global.json web/package.json web/package-lock.json web/playwright.config.ts; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Application changes require $path and the complete Slice 1 verification setup."
              exit 1
            fi
          done
          if [[ -z "$(git ls-files -- 'src/*.csproj' 'src/**/*.csproj')" ]] ||
             [[ -z "$(git ls-files -- 'tests/*.csproj' 'tests/**/*.csproj')" ]] ||
             [[ -z "$(git ls-files -- 'web/e2e/*.spec.ts' 'web/e2e/**/*.spec.ts')" ]]; then
            echo "::error::Application changes require backend, API test, and browser test projects."
            exit 1
          fi
          echo "application=true" >> "$GITHUB_OUTPUT"

  application:
    needs: baseline
    if: needs.baseline.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          # Disposable runner-local service only; never use deployment credentials.
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Create separate browser-test database
        env:
          PGPASSWORD: ci-test-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE task_manager_e2e;'
      - name: Run PostgreSQL-backed API tests
        env:
          TASK_MANAGER_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=task_manager_test;Username=postgres;Password=ci-test-only
        run: dotnet test TaskManager.sln --configuration Release
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend tests, lint, and build
        working-directory: web
        run: |
          npm run test
          npm run lint
          npm run build
      - name: Run required review regressions
        working-directory: web
        run: npm run test:regressions
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Install certificate trust tooling
        run: sudo apt-get install -y libnss3-tools
      - name: Run isolated browser tests without sensitive captures
        working-directory: web
        env:
          CI: 'true'
          # Deliberately inherited: the E2E child API must clear this override.
          TASK_MANAGER_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=task_manager_test;Username=postgres;Password=ci-test-only
          ConnectionStrings__TaskManager: Host=127.0.0.1;Port=5432;Database=task_manager_e2e;Username=postgres;Password=ci-test-only
        run: npm run test:e2e -- --project=chromium --trace=off --reporter=line
